# Database Configuration for Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/pawn_db
spring.datasource.username=pawn_user
spring.datasource.password=pawn_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
pawn.jwt.secret=YourSecretKeyForJWTTokenGenerationMustBeLongEnoughAndSecure2025
pawn.jwt.expiration=3600000
pawn.jwt.refresh-expiration=604800000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
