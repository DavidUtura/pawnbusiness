server:
  port: 8080

spring:
  application:
    name: pawn-ge-backend
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pawn_ge}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  cache:
    type: redis
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloud:
  aws:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      region: us-east-1
    credentials:
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
    stack:
      auto: false

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-minimum-32-characters}
  expiration: 86400000
  refresh-expiration: 604800000

pawn:
  marketplace:
    name: Pawn.ge
    currency: GEL

logging:
  level:
    ge.pawn: DEBUG
    org.springframework.security: DEBUG
