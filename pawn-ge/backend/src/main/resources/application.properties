spring.application.name=pawn-backend

# Server Configuration
server.port=8080

# Database Configuration - Use H2 for development/testing without Docker
spring.datasource.url=jdbc:h2:mem:pawndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway Configuration - Disabled for H2 dev mode
spring.flyway.enabled=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
pawn.jwt.secret=YourSecretKeyForJWTTokenGenerationMustBeLongEnoughAndSecure2025
pawn.jwt.expiration=3600000
pawn.jwt.refresh-expiration=604800000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
