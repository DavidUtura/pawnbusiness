# ============================================================
# Dev profile — used by docker-compose (SPRING_PROFILES_ACTIVE=dev)
# PostgreSQL + Flyway migrations. All values overridable via env.
# Local runs without Docker fall back to H2 in application.properties.
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/pawn_ge}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:pawn_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:pawn_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis (optional in dev; only used if a RedisTemplate-backed feature is active)
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# S3 / MinIO
aws.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
aws.s3.access-key=${S3_ACCESS_KEY:minioadmin}
aws.s3.secret-key=${S3_SECRET_KEY:minioadmin}
aws.s3.bucket-name=${S3_BUCKET_NAME:pawn-products}

# JWT
pawn.jwt.secret=${JWT_SECRET:YourSecretKeyForJWTTokenGenerationMustBeLongEnoughAndSecure2025}
pawn.jwt.expiration=3600000
pawn.jwt.refresh-expiration=604800000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
