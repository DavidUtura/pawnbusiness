services:
  postgres:
    image: postgres:16-alpine
    container_name: pawn-ge-postgres
    environment:
      POSTGRES_DB: pawn_ge
      POSTGRES_USER: pawn_user
      POSTGRES_PASSWORD: pawn_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pawn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawn_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pawn-ge-redis
    ports:
      - "6379:6379"
    networks:
      - pawn-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pawn-ge-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - pawn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawn-ge-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pawn_ge
      SPRING_DATASOURCE_USERNAME: pawn_user
      SPRING_DATASOURCE_PASSWORD: pawn_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      - pawn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    container_name: pawn-ge-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - pawn-network

volumes:
  postgres_data:
  minio_data:

networks:
  pawn-network:
    driver: bridge
